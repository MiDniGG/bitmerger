name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: ./scripts/build.sh "${GITHUB_REF_NAME}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *-*) pre="--prerelease" ;; esac
          sed -e "s#REPO#${GITHUB_REPOSITORY}#g" -e "s#TAG#${GITHUB_REF_NAME}#g" .github/release-notes.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* $pre --title "BitMerger ${GITHUB_REF_NAME}" --notes-file notes.md
